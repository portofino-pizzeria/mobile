name: Web site current

# Asks, on a clock, the one question the deploy pipeline exists to answer:
# is https://portofino-essen.com/ serving the tip of `main`, and does the page
# it serves actually work?
#
# Why a second workflow when deploy-web.yml already proves every deploy and
# raises a `Web deploy failed` issue when it cannot: the alarm there lives in
# the SAME run as the deploy, so whatever stops the deploy from running stops
# the alarm too. Measured 2026-09-13: the push deploy of c25c2d4 (run
# 34748395985) never started — "The job was not started because it repeatedly
# failed to be acquired (5 attempts)", a GitHub-side runner outage — and
# `notify-failure` died the same way. No issue was opened. `main`'s head was not
# live, and nothing said so, for six hours, until the next unrelated push
# happened to deploy it. That is the stale-site invisibility the plan set out
# to remove (plans/2026-09-10-automatic-deployment.md, "Decisions taken during
# vetting": a failed deploy must not be as invisible as a stale site).
#
# This job runs on the same hosted runners, so it shares the outage — but not
# the moment. It re-asks every half hour, and the first tick that acquires a
# runner raises the alarm. "Invisible until the next push" becomes "invisible
# until the next tick", and the alarm no longer depends on the failing run.
#
# It reads the site and GitHub; it deploys nothing and never touches S3.

on:
  schedule:
    # GitHub disables a public repository's scheduled workflows after 60 days
    # without a commit, with one email and nothing in the repo to show for it.
    # If the alarm goes quiet on a repo that has gone quiet, look under
    # Actions -> this workflow for the "disabled" banner before anything else.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# A tick delayed past the next one must not run beside it — two concurrent
# ticks both find no open issue and both open one.
concurrency:
  group: web-site-current
  cancel-in-progress: false

env:
  SITE_URL: https://portofino-essen.com
  # A push deploy takes about four minutes end to end. A head younger than
  # this, with no deploy run visible for it yet, is a queue delay, not drift.
  # Measured from the commit's committer date, which is merge time for a merge
  # or squash but authoring time for a commit made locally and pushed later —
  # so for those the grace is already spent at push, and only the seconds
  # between push and run creation are covered. A failed run inside the window
  # is deploy-web.yml's notify-failure to report, not this one's.
  HEAD_GRACE_MINUTES: 15
  # A deploy run that has been queued or running longer than this is not "in
  # flight", it is stuck — deploy-web.yml sets no job timeout, so during a
  # runner outage a push deploy can sit queued for GitHub's six-hour default,
  # and waiting for it would silence the alarm for exactly the outage this
  # workflow exists to report.
  DEPLOY_STUCK_MINUTES: 30
  # One fetch that fails is a transient edge error; three over two minutes is
  # the site not answering. Retried within the tick because nothing carries
  # state between ticks — "let the next tick decide" would never decide.
  FETCH_ATTEMPTS: 3
  FETCH_RETRY_SECONDS: 40
  TITLE: Web deploy failed

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      # Read GitHub BEFORE the site. The site read can take a minute and a half
      # on retries, and a deploy that lands inside that gap must not produce
      # "site serves the old sha, head is the new one, no run in flight" — a
      # false alarm. Read the head first and a push in the gap reads as
      # current, to be caught one tick later.
      - name: Read main's head and the deploy queue
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Not `github.sha`. That value is fixed when the run is created, and
          # a scheduled run can sit queued behind a runner outage — the very
          # case this workflow exists for — while a push lands and deploys.
          # Comparing the site against the stale value would open an issue for
          # a head that is already live. Reading it live also keeps a dispatch
          # from another branch honest.
          HEAD_SHA="$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')"
          export HEAD_SHA
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "main's head: $HEAD_SHA"

          COMMITTED_AT="$(gh api "repos/$GH_REPO/commits/$HEAD_SHA" --jq '.commit.committer.date')"
          HEAD_AGE_MINUTES=$(( ( $(date -u +%s) - $(date -u -d "$COMMITTED_AT" +%s) ) / 60 ))
          echo "age_minutes=$HEAD_AGE_MINUTES" >> "$GITHUB_OUTPUT"

          # The deploy runs for this head that have not concluded. A rollback
          # dispatch shows up here too (its headSha is main's head, the branch
          # it was dispatched on) and is waited for the same way; once it
          # completes the site differs from the head and the next tick alarms,
          # which is the documented invariant. `createdAt` is what tells a run
          # that is deploying from one that is stuck.
          OLDEST_CREATED="$(gh run list --workflow deploy-web.yml --branch main --limit 20 \
            --json headSha,status,createdAt \
            --jq '[.[] | select(.headSha == env.HEAD_SHA and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")) | .createdAt] | sort | first // empty')"
          if [ -z "$OLDEST_CREATED" ]; then
            echo "in_flight=none" >> "$GITHUB_OUTPUT"
            echo "no deploy of $HEAD_SHA is queued or running"
          else
            IN_FLIGHT_MINUTES=$(( ( $(date -u +%s) - $(date -u -d "$OLDEST_CREATED" +%s) ) / 60 ))
            if [ "$IN_FLIGHT_MINUTES" -lt "$DEPLOY_STUCK_MINUTES" ]; then
              echo "in_flight=running" >> "$GITHUB_OUTPUT"
              echo "a deploy of $HEAD_SHA has been in flight for $IN_FLIGHT_MINUTES min"
            else
              echo "in_flight=stuck" >> "$GITHUB_OUTPUT"
              echo "in_flight_minutes=$IN_FLIGHT_MINUTES" >> "$GITHUB_OUTPUT"
              echo "a deploy of $HEAD_SHA has been queued or running for $IN_FLIGHT_MINUTES min"
            fi
          fi

      - name: Read the live site
        id: live
        run: |
          set -euo pipefail
          fetch() {
            # $1 = url, $2 = output file. Retries within the tick; prints the
            # content type and returns non-zero only when every attempt missed.
            local attempt ct
            for attempt in $(seq 1 "$FETCH_ATTEMPTS"); do
              if ct="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' -o "$2" -w '%{content_type}' "$1")"; then
                printf '%s' "$ct"
                return 0
              fi
              echo "attempt $attempt of $FETCH_ATTEMPTS: $1 did not answer" >&2
              if [ "$attempt" -lt "$FETCH_ATTEMPTS" ]; then sleep "$FETCH_RETRY_SECONDS"; fi
            done
            return 1
          }

          if ! fetch "$SITE_URL/" page.html >/dev/null; then
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "sha=<none>" >> "$GITHUB_OUTPUT"
            echo "bundle=unknown" >> "$GITHUB_OUTPUT"
            echo "::error::$SITE_URL/ did not answer $FETCH_ATTEMPTS times."
            exit 0
          fi
          echo "reachable=true" >> "$GITHUB_OUTPUT"

          # `|| true` on every extraction: a page with no marker is a finding for
          # the step below, not a crash here. The marker is a full 40-hex sha
          # (deploy-web.yml exports `git rev-parse HEAD`); anything else — a
          # local export's `unknown`, or content from an origin that is not
          # ours — is reduced to `<none>` rather than carried into an issue.
          LIVE="$(grep -o -m1 '<meta name="build-sha" content="[^"]*"' page.html \
            | sed 's/.*content="//; s/"$//' | tr -cd '0-9a-f' | head -c 40 || true)"
          [ "${#LIVE}" -eq 40 ] || LIVE=""
          echo "sha=${LIVE:-<none>}" >> "$GITHUB_OUTPUT"
          echo "live build-sha: ${LIVE:-<none>}"

          # The marker says which build the HTML is; it does not say the page
          # works. Both 403 and 404 are rewritten to /index.html with HTTP 200,
          # so a missing bundle is served as HTML, the browser parses HTML as
          # JavaScript, and the page is blank. Fetch what the page references
          # and prove it is JavaScript — the same check deploy-web.yml makes
          # once, at deploy time, made continuously. Four answers, kept apart
          # because their messages differ: JavaScript (ok), something else
          # (blank site), no answer (unknown — a bundle that could not be
          # fetched is not a bundle served as HTML), no reference (missing).
          BUNDLE="$(grep -o '/_expo/static/js/web/[^"]*\.js' page.html | head -1 || true)"
          if [ -z "$BUNDLE" ]; then
            echo "index.html references no /_expo/static/js/web bundle"
            echo "bundle=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! CT="$(fetch "$SITE_URL$BUNDLE" bundle.live.js)"; then
            echo "bundle=unknown" >> "$GITHUB_OUTPUT"
            echo "::error::$SITE_URL$BUNDLE did not answer $FETCH_ATTEMPTS times."
            exit 0
          fi
          echo "bundle $BUNDLE served as '$CT'"
          BUNDLE_STATE=html
          case "$CT" in
            *javascript*)
              if ! head -c 512 bundle.live.js | grep -qi '<!doctype\|<html'; then
                BUNDLE_STATE=ok
              fi
              ;;
          esac
          echo "bundle=$BUNDLE_STATE" >> "$GITHUB_OUTPUT"

      - name: Decide whether the site is current
        id: verdict
        env:
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          HEAD_AGE_MINUTES: ${{ steps.head.outputs.age_minutes }}
          IN_FLIGHT: ${{ steps.head.outputs.in_flight }}
          IN_FLIGHT_MINUTES: ${{ steps.head.outputs.in_flight_minutes }}
          REACHABLE: ${{ steps.live.outputs.reachable }}
          LIVE_SHA: ${{ steps.live.outputs.sha }}
          BUNDLE: ${{ steps.live.outputs.bundle }}
        run: |
          set -euo pipefail
          alarm=""
          if [ "$REACHABLE" != "true" ]; then
            alarm="$SITE_URL did not answer $FETCH_ATTEMPTS times over about two minutes"
          elif [ "$BUNDLE" = "unknown" ]; then
            alarm="the bundle the live page references did not answer $FETCH_ATTEMPTS times — the site may be blank"
          elif [ "$BUNDLE" = "missing" ]; then
            alarm="the live page references no /_expo/static/js/web bundle — the site is blank"
          elif [ "$BUNDLE" != "ok" ]; then
            alarm="the live page references a bundle that is not served as JavaScript — the site is blank"
          elif [ "$LIVE_SHA" != "$HEAD_SHA" ]; then
            # main moved and the site did not follow. Before calling that a
            # failure, rule out a deploy that is simply still running, and a
            # head so fresh its run has not been created yet (GitHub's queue can
            # lag a push).
            case "$IN_FLIGHT" in
              running)
                echo "verdict=in_flight" >> "$GITHUB_OUTPUT"
                echo "A deploy of $HEAD_SHA is queued or running; not drift yet."
                exit 0
                ;;
              stuck)
                alarm="main's head $HEAD_SHA is not live: the site serves $LIVE_SHA and a deploy of the head has been queued or running for $IN_FLIGHT_MINUTES min"
                ;;
              *)
                if [ "$HEAD_AGE_MINUTES" -lt "$HEAD_GRACE_MINUTES" ]; then
                  echo "verdict=grace" >> "$GITHUB_OUTPUT"
                  echo "$HEAD_SHA is $HEAD_AGE_MINUTES min old and no deploy of it is running; within the grace period."
                  exit 0
                fi
                alarm="main's head $HEAD_SHA is not live: the site serves $LIVE_SHA and no deploy of the head is running"
                ;;
            esac
          fi

          if [ -z "$alarm" ]; then
            echo "verdict=current" >> "$GITHUB_OUTPUT"
            echo "$SITE_URL serves main's head ($HEAD_SHA) and its bundle is JavaScript."
            exit 0
          fi
          echo "verdict=stale" >> "$GITHUB_OUTPUT"
          echo "reason=$alarm" >> "$GITHUB_OUTPUT"
          echo "::error::$alarm"

      - name: Raise or update the alarm
        if: steps.verdict.outputs.verdict == 'stale'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          LIVE_SHA: ${{ steps.live.outputs.sha }}
          REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          set -euo pipefail
          # The same issue deploy-web.yml's notify-failure opens, by the same
          # title and the same author match, so there is ever one alarm — and
          # deploy-web.yml's notify-recovery closes it on the next successful
          # deploy of main's head, exactly as it closes its own. Listed rather
          # than searched, for the reason given there: the search index lags.
          BODY="Watchdog: $REASON. Live build-sha \`$LIVE_SHA\`, main \`$HEAD_SHA\`. Run: $RUN_URL"
          EXISTING="$(gh issue list --state open --limit 100 \
            --json number,title,author \
            --jq '[.[] | select(.title == env.TITLE and .author.login == "app/github-actions") | .number][0] // empty')"
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
            exit 0
          fi
          # Every half hour of the same stale state would otherwise add the same
          # comment. Comment only when the pair (live, head) changed since the
          # watchdog's own last entry — a new head that also failed to ship is
          # news; the same head still not shipped is not. The watchdog's own
          # entries, so a person discussing the issue does not provoke a
          # repeat. gh spells the bot two ways: an issue's author reads
          # `app/github-actions`, a comment's author reads `github-actions`
          # (measured on #7). Both are matched, and the entry must be one of
          # ours, so a changed spelling degrades to "dedup against nothing the
          # bot wrote" rather than to matching a stranger's comment.
          LAST="$(gh issue view "$EXISTING" --json comments,body \
            --jq '([.body] + [.comments[] | select(.author.login == "github-actions" or .author.login == "app/github-actions") | .body]) | map(select(startswith("Watchdog:"))) | last // empty')"
          if printf '%s' "$LAST" | grep -qF "Live build-sha \`$LIVE_SHA\`, main \`$HEAD_SHA\`"; then
            echo "#$EXISTING already records live=$LIVE_SHA head=$HEAD_SHA; nothing new to say."
            exit 0
          fi
          gh issue comment "$EXISTING" --body "$BODY"

      # The other half. Two of the alarms above heal on their own — a site or a
      # bundle that stopped answering for two minutes — and deploy-web.yml's
      # notify-recovery closes the issue only when it deploys main's head, so
      # without this step a transient alarm would stay open until the next
      # push: a stale alarm, the same defect class as a stale site. A tick that
      # finds the site serving main's head with a JavaScript bundle closes every
      # open alarm the bot raised, naming what it saw — including a rollback's
      # alarm once the roll-forward has landed. Same list-and-close loop as
      # notify-recovery, same author match, so a stranger's issue is never
      # touched.
      - name: Close the alarm when the site is current
        if: steps.verdict.outputs.verdict == 'current'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          OPEN="$(gh issue list --state open --limit 100 \
            --json number,title,author \
            --jq '.[] | select(.title == env.TITLE and .author.login == "app/github-actions") | .number')"
          if [ -z "$OPEN" ]; then
            echo "No open '$TITLE' issue — nothing to close."
            exit 0
          fi
          BODY="Recovered: \`$HEAD_SHA\` is live and its bundle is JavaScript. Run: $RUN_URL"
          for n in $OPEN; do
            gh issue close "$n" --comment "$BODY"
            echo "Closed #$n."
          done
