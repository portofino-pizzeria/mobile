name: qontinui CI
on: [push, pull_request]
# This job now executes the repo's own build toolchain (the export below), so
# the token it runs under is narrowed to the minimum that needs.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci || npm install
      - name: Type check
        run: if [ -f tsconfig.json ]; then npx --yes tsc --noEmit; fi
      - name: Lint
        run: npm run lint --if-present
      # `npm run build --if-present` was a silent no-op — package.json defines no
      # `build` script — so CI never exercised the web export the deploy
      # workflow ships. Run the export itself: it is the artifact that reaches
      # customers, and a broken one must fail here rather than at deploy time.
      - name: Export web build
        run: npx expo export --platform web
      # Required by `policy/ux-priorities`, clause
      # `an-asset-the-machine-cannot-reach-does-not-exist`. Stdlib-only, so no
      # dependency step is needed.
      #
      # The two menu-join checks are reported SKIPPED here rather than passed:
      # the menu lives in the sibling `backend` repo, which is not in this
      # checkout. That is an honest UNKNOWN — `scripts/derive-assets.py` runs
      # both halves locally, where both repos are present, and refuses to
      # derive when the sheet order and the menu disagree.
      - name: Asset manifest drift
        run: python3 scripts/check-assets.py
      # Still a no-op: package.json defines no `test` script. Left in place so
      # the step exists the day one is added.
      - name: Test
        run: npm test --if-present
