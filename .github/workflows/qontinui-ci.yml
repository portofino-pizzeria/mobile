name: qontinui CI
on:
  push:
  pull_request:
  # The asset drift check below joins this repo's manifest against the MENU,
  # which lives in the sibling backend repo and changes without any commit
  # here. A push/PR-only trigger would measure that drift only on the next
  # mobile change — possibly weeks after the owner added a dish — so the
  # whole job also runs daily, and on demand.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
# This job now executes the repo's own build toolchain (the export below), so
# the token it runs under is narrowed to the minimum that needs.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci || npm install
      - name: Type check
        run: if [ -f tsconfig.json ]; then npx --yes tsc --noEmit; fi
      - name: Lint
        run: npm run lint --if-present
      # `npm run build --if-present` was a silent no-op — package.json defines no
      # `build` script — so CI never exercised the web export the deploy
      # workflow ships. Run the export itself: it is the artifact that reaches
      # customers, and a broken one must fail here rather than at deploy time.
      - name: Export web build
        run: npx expo export --platform web
      # Required by `policy/ux-priorities`, clause
      # `an-asset-the-machine-cannot-reach-does-not-exist`. Stdlib-only, so no
      # dependency step is needed.
      #
      # The menu-join half needs the menu, which lives in the sibling `backend`
      # repo (public). Only `data/menu.json` is fetched, into `backend/`, and
      # handed to the check, so the third clause ("a menu item in an
      # illustrated category with no manifest entry") is measured against the
      # menu on the backend's default branch rather than reported SKIPPED. The
      # step fails, not skips, if that file is missing: `--menu` names a path,
      # and a path that is not there is an error. A red here on a mobile PR
      # that touched nothing nearby is the menu having moved under the
      # manifest — the signal this check exists to raise, not noise.
      - name: Fetch the menu the manifest binds to
        uses: actions/checkout@v4
        with:
          repository: portofino-pizzeria/backend
          path: backend
          sparse-checkout: data/menu.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Asset manifest drift
        run: python3 scripts/check-assets.py --menu backend/data/menu.json
      # Still a no-op: package.json defines no `test` script. Left in place so
      # the step exists the day one is added.
      - name: Test
        run: npm test --if-present
