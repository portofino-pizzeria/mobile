name: Deploy web

# Publishes the Expo web export to S3 + CloudFront.
#
# ⛔ TRIGGER: `push` on `main` ONLY — never `workflow_run`.
#
# This repository is PUBLIC and `qontinui-ci.yml` runs `on: [push, pull_request]`,
# so a pull request from a fork produces a completed workflow run. A
# `workflow_run`-triggered job runs on the default branch with full OIDC access
# and its `sub` claim is `repo:portofino-pizzeria/mobile:ref:refs/heads/main` —
# exactly what the deploy role's trust policy pins (infra/github-oidc.tf).
# Checking out `event.workflow_run.head_sha`, or merely running `npm ci` against
# the attacker's `package.json` (lifecycle scripts run as part of install),
# would execute fork-authored code while holding the production S3 + CloudFront
# role. A `push`-triggered job never runs for a fork. The build gate therefore
# lives in THIS workflow as a `needs:` job rather than being imported from
# another workflow's run.
#
# The `workflow_dispatch` below is the same door by another route: its OIDC
# subject is derived from the branch it is dispatched ON (main), not from
# `inputs.ref`, and `refs/pull/<n>/merge` IS a ref in this repository. So the
# build job refuses any commit that is not already an ancestor of origin/main,
# and the deploy job publishes the SHA the build job resolved — never a ref it
# re-resolves for itself.

on:
  push:
    branches: [main]
  # Rollback / first publish. Re-running this workflow replays the same commit,
  # so it is not a rollback; deploying an explicit ref is.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit SHA to build and publish. Must be an ancestor of main.'
        required: false
        default: main

permissions:
  id-token: write
  contents: read

# Two quick merges must not interleave two publishes. Never cancel in flight —
# a cancelled run can leave the bucket half-published.
concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  # Written by Terraform (infra/github-oidc.tf). CI must not carry copies of
  # these values: the bucket name embeds the AWS account id, the distribution id
  # is generated, and the API URL is derived from `domain_name`. A workflow-local
  # copy is a silent drift channel that the bundle guard below would not catch.
  # All three are plain `String` parameters, so no --with-decryption is needed;
  # a SecureString would come back as ciphertext here.
  SSM_WEB_BUCKET_PARAM: /portofino/production/web/bucket
  SSM_WEB_DISTRIBUTION_PARAM: /portofino/production/web/distribution_id
  SSM_API_URL_PARAM: /portofino/production/api_url
  # Verification target only — nothing is shipped from this value, and a wrong
  # one reds the run after a successful publish rather than shipping anything
  # wrong. Terraform derives it from `domain_name` (locals.tf), so a domain
  # change means editing this line.
  SITE_URL: https://portofino-essen.com

jobs:
  # The gate. `qontinui-ci.yml` also runs on this push, but a deploy job cannot
  # depend on a separate workflow's run without `workflow_run` (see above), so
  # the gate is repeated here where `needs:` can enforce it.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # The one commit this whole run is about. Resolved ONCE, here, so the
      # deploy job cannot publish a different commit than the one gated — which
      # is what re-evaluating a moving ref like `main` in both jobs would allow.
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Refuse to publish a commit that is not on main
        # A dispatch may name any ref in this repo, including refs/pull/<n>/merge,
        # which carries fork-authored code. The deploy job runs the export while
        # holding the production role, so the commit must be one that already
        # passed review and landed. Rollback targets are always ancestors of
        # main, so this does not restrict the rollback path.
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          HEAD_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "::error::$HEAD_SHA is not an ancestor of origin/main — refusing to publish it."
            exit 1
          fi
          echo "$HEAD_SHA is on main."

      - name: Resolve the commit being published
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The same gate `qontinui-ci.yml` runs. It is repeated here for the reason
      # the job comment gives: this workflow cannot depend on that one's run, so
      # every check that guards a merge must also guard the publish, or a
      # manifest that drifts from the files it names ships anyway. Stdlib-only
      # and independent of the toolchain, so it runs before `npm ci` and fails
      # in seconds rather than after a full export.
      #
      # The menu-join half needs the menu, which lives in the sibling `backend`
      # repo (public). Only `data/menu.json` is fetched, as CI does, so the
      # check is measured against the real menu here too rather than SKIPPED —
      # a publish is exactly the moment a dish with no art must not slip past.
      # No credentials are persisted: this job never needs to write anywhere.
      - name: Fetch the menu the manifest binds to
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: portofino-pizzeria/backend
          path: backend
          sparse-checkout: data/menu.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Asset manifest drift
        run: python3 scripts/check-assets.py --menu backend/data/menu.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Export web build
        # No API URL here — this run proves the bundle builds, not what it points
        # at. The deploy job re-exports with the real value and guards it.
        run: npx expo export --platform web

      - name: No UI Bridge control surface in the export
        run: bash scripts/check-web-export-has-no-control-surface.sh dist

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      BUILD_SHA: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The exact commit the build job gated, never a re-resolved ref.
          ref: ${{ needs.build.outputs.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the deploy role is configured
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::secrets.AWS_DEPLOY_ROLE_ARN is unset. Set it to the portofino-ci-web role ARN created by infra/github-oidc.tf."
            exit 1
          fi

      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read deploy config from SSM
        id: config
        run: |
          set -euo pipefail
          read_param() {
            local value
            # A missing parameter exits non-zero here and fails the step. `None`
            # is what --output text prints for a null, and is not a value.
            value="$(aws ssm get-parameter --name "$1" --query 'Parameter.Value' --output text)"
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "::error::SSM parameter $1 is empty. Has infra applied the Phase 2 parameters?" >&2
              return 1
            fi
            printf '%s' "$value"
          }
          API_URL="$(read_param "$SSM_API_URL_PARAM")"
          BUCKET="$(read_param "$SSM_WEB_BUCKET_PARAM")"
          DISTRIBUTION_ID="$(read_param "$SSM_WEB_DISTRIBUTION_PARAM")"
          # This repo is PUBLIC and so are its Actions logs. The bucket name
          # embeds the AWS account id and every `aws s3` line would print it.
          echo "::add-mask::$BUCKET"
          echo "::add-mask::$DISTRIBUTION_ID"
          {
            echo "api_url=$API_URL"
            echo "bucket=$BUCKET"
            echo "distribution_id=$DISTRIBUTION_ID"
          } >> "$GITHUB_OUTPUT"
          echo "API URL: $API_URL"

      - name: Export web build
        env:
          # --clear is REQUIRED: EXPO_PUBLIC_* values are inlined at build time,
          # and a stale Metro cache silently bakes in the previous value (e.g.
          # localhost, or the previous commit's SHA). Verified 2026-07-18.
          EXPO_PUBLIC_API_URL: ${{ steps.config.outputs.api_url }}
          EXPO_PUBLIC_BUILD_SHA: ${{ needs.build.outputs.sha }}
        run: npx expo export --platform web --clear

      - name: Guard — the intended API host is in the shipped bundle
        # Ported from infra/scripts/deploy-web.ps1. A stale cache that baked in
        # the wrong API host must abort the deploy, not ship.
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.config.outputs.api_url }}
        run: |
          set -euo pipefail
          API_HOST="$(node -e 'process.stdout.write(new URL(process.env.EXPO_PUBLIC_API_URL).host)')"
          if [ -z "$API_HOST" ]; then
            echo "::error::Could not derive a host from EXPO_PUBLIC_API_URL"
            exit 1
          fi
          if ! grep -qF -- "$API_HOST" dist/_expo/static/js/web/*.js; then
            echo "::error::API host '$API_HOST' not found in the built bundle — aborting deploy (stale cache?)"
            exit 1
          fi
          echo "API host '$API_HOST' found in the bundle."

      - name: Guard — no UI Bridge control surface in the shipped bundle
        # The export above is the one that ships. The same check runs in the
        # build job and in qontinui-ci.yml; this one guards what is published.
        run: bash scripts/check-web-export-has-no-control-surface.sh dist

      - name: Guard — the build marker is in the exported HTML
        run: |
          set -euo pipefail
          if ! grep -qF "<meta name=\"build-sha\" content=\"$BUILD_SHA\"" dist/index.html; then
            echo "::error::dist/index.html does not carry build-sha=$BUILD_SHA — the live assertion below could never pass."
            exit 1
          fi

      - name: Publish to S3 (hashed assets first, HTML last, never pruning)
        # ⛔ NOT `aws s3 sync --delete`.
        #
        # The export is stable-path HTML plus one content-hashed bundle. Pruning
        # removes the OLD bundle while edge- and browser-cached HTML (default_ttl
        # 3600) still references it. That request 403s, and the distribution
        # rewrites 403 to /index.html with HTTP 200 — so the browser parses HTML
        # as JavaScript and the page goes blank, silently, for up to an hour.
        # `query_string = false` means cache-busting cannot rescue a diner from
        # it.
        #
        # ⚠️ Nothing prunes the old objects, and that is now a DECISION rather
        # than a gap. infra's lifecycle configuration on the web bucket carries
        # only the one rule that is safe by construction (abort incomplete
        # multipart uploads) and deliberately no age-based expiry: bundle keys
        # are content-hashed and never rewritten, so an object's age is the age
        # of its build, not evidence that nothing references it — production
        # was measured serving an eight-day-old build, which a 7-day rule would
        # have deleted while still answering HTTP 200. See "The publish
        # invariant, and old builds" in infra/README.md. Pruning safely needs a
        # reference-aware step (read the live HTML, keep what it names plus the
        # last N builds, delete the rest), which would live in THIS workflow and
        # does not exist yet; until it does, storage grows by about one bundle
        # per build, which is cheap next to the outage an age rule would cause.
        env:
          BUCKET: ${{ steps.config.outputs.bucket }}
        run: |
          set -euo pipefail

          # Everything in dist/ must be covered by one of the rules below. A new
          # export artifact (robots.txt, a manifest, anything dropped in by a
          # public/ dir) would otherwise be silently left unpublished.
          UNCOVERED="$(find dist -type f \
            ! -path 'dist/_expo/*' ! -path 'dist/assets/*' \
            ! -name '*.html' ! -name 'favicon.ico')"
          if [ -n "$UNCOVERED" ]; then
            echo "::error::files in dist/ that no publish rule covers:"
            echo "$UNCOVERED"
            exit 1
          fi

          # 1. Content-hashed JS/CSS. New paths, so no live page can break.
          #    The exclude is wildcard-prefixed so it matches whether the CLI
          #    compares the pattern against the source-relative or the full path.
          aws s3 sync dist/_expo "s3://$BUCKET/_expo" \
            --exclude '*.routes.json' \
            --cache-control 'public,max-age=31536000,immutable' \
            --no-progress

          # 2. Content-hashed images + fonts.
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --cache-control 'public,max-age=31536000,immutable' \
            --no-progress

          # 3. Stable-path non-HTML. Content changes under a fixed key, so these
          #    must revalidate rather than be treated as immutable. The favicon's
          #    hour is a choice this workflow makes; the plan prescribes only the
          #    immutable/no-cache pair above and below.
          if [ -f dist/favicon.ico ]; then
            aws s3 cp dist/favicon.ico "s3://$BUCKET/favicon.ico" \
              --cache-control 'public,max-age=3600' --no-progress
          fi
          if [ -f dist/_expo/.routes.json ]; then
            aws s3 cp dist/_expo/.routes.json "s3://$BUCKET/_expo/.routes.json" \
              --cache-control 'no-cache' --no-progress
          fi

          # 4. HTML LAST — this is the step that flips the site to the new build,
          #    and every asset it references is already in place. The include set
          #    must stay HTML-only: --content-type applies to everything matched.
          aws s3 sync dist "s3://$BUCKET" \
            --exclude '*' --include '*.html' \
            --cache-control 'no-cache' \
            --content-type 'text/html; charset=utf-8' \
            --no-progress

      - name: Invalidate CloudFront and wait for it
        env:
          DISTRIBUTION_ID: ${{ steps.config.outputs.distribution_id }}
        run: |
          set -euo pipefail
          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' --output text)"
          echo "Invalidation $INVALIDATION_ID created; waiting for completion..."
          # The waiter gives up after ~10 minutes. That is not a failed deploy —
          # the bytes are already in place — so let the live assertion below be
          # what decides.
          if aws cloudfront wait invalidation-completed \
              --distribution-id "$DISTRIBUTION_ID" --id "$INVALIDATION_ID"; then
            echo "Invalidation $INVALIDATION_ID completed."
          else
            echo "::warning::Invalidation $INVALIDATION_ID has not completed yet; relying on the live assertion."
          fi

      - name: Verify the live site serves this build
        # The deploy is proved by fetching the site, not by the exit code of the
        # publish step above.
        run: |
          set -euo pipefail

          # Every extraction is `|| true`: a fetch that returns the OLD build has
          # no matching marker, grep exits 1, and under `set -e` + `pipefail`
          # that would abort the step instead of retrying. The request header is
          # not what defeats the edge cache — the invalidation above is; it is
          # here for any intermediary that does honour it.
          HTML=''
          for attempt in $(seq 1 10); do
            HTML="$(curl -fsS -H 'Cache-Control: no-cache' "$SITE_URL/" || true)"
            LIVE="$(printf '%s' "$HTML" \
              | grep -o -m1 '<meta name="build-sha" content="[^"]*"' \
              | sed 's/.*content="//; s/"$//' || true)"
            if [ "$LIVE" = "$BUILD_SHA" ]; then
              echo "$SITE_URL is serving build-sha=$LIVE"
              break
            fi
            echo "attempt $attempt: live build-sha='${LIVE:-<none>}', expected '$BUILD_SHA'"
            LIVE=''
            if [ "$attempt" -lt 10 ]; then sleep 15; fi
          done
          if [ "${LIVE:-}" != "$BUILD_SHA" ]; then
            echo "::error::$SITE_URL never served build-sha=$BUILD_SHA. The publish may be incomplete — investigate before pushing again."
            exit 1
          fi

          # The marker alone does not prove the site WORKS. Both 403 and 404 are
          # rewritten to /index.html with HTTP 200, so a missing bundle is served
          # as HTML, the browser parses HTML as JavaScript, and the page is blank
          # while this assertion happily passes. Fetch what the page actually
          # references and prove it is JavaScript.
          BUNDLE="$(printf '%s' "$HTML" \
            | grep -o '/_expo/static/js/web/[^"]*\.js' | head -1 || true)"
          if [ -z "$BUNDLE" ]; then
            echo "::error::live index.html references no /_expo/static/js/web bundle"
            exit 1
          fi
          CT="$(curl -fsS -o bundle.live.js -w '%{content_type}' "$SITE_URL$BUNDLE")"
          case "$CT" in
            *javascript*) ;;
            *) echo "::error::$BUNDLE served as '$CT' — the 403/404 rewrite fired, so the bundle is missing"; exit 1 ;;
          esac
          if head -c 512 bundle.live.js | grep -qi '<!doctype\|<html'; then
            echo "::error::$BUNDLE served HTML — the bundle is missing and the site is blank"
            exit 1
          fi
          rm -f bundle.live.js
          echo "$BUNDLE is live and is JavaScript ($CT)."

  # A failed deploy must not be as invisible as the stale site this pipeline
  # exists to prevent. Note this does not fire on a CANCELLED run — which is how
  # the concurrency queue disposes of a superseded run, and not a failure.
  #
  # The alarm is one issue, `Web deploy failed`, commented on each further
  # failure and CLOSED by `notify-recovery` below on the next successful deploy.
  # Before that job existed the issue stayed open through every later success
  # (measured: #7, opened by the first push, still open after two green
  # deploys) — a stale alarm is the same defect class as a stale site.
  notify-failure:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the deploy-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # There is no checkout in this job, so `gh` has no git remote to infer
          # the repository from. Without this it exits "could not determine base
          # repository" and the alarm is as silent as the failure it reports.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_SHA: ${{ needs.build.outputs.sha || github.sha }}
          TITLE: Web deploy failed
        run: |
          set -euo pipefail
          BODY="Deploy of \`$FAILED_SHA\` failed. Run: $RUN_URL"
          # Listed, not searched: GitHub's search index lags issue creation by up
          # to minutes, and two failures in a row would then open two issues.
          # Matched on author as well as title: this repo is public, so anyone
          # can open an issue with this title, and the bot must only ever touch
          # its own. (`--author` does not resolve an app login, hence the jq.)
          EXISTING="$(gh issue list --state open --limit 100 \
            --json number,title,author \
            --jq '[.[] | select(.title == env.TITLE and .author.login == "app/github-actions") | .number][0] // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

  # The other half of the alarm: a deploy that succeeds after one that failed
  # closes the open issue, naming the run and the commit that recovered, so an
  # open `Web deploy failed` issue always means the last deploy of main's head
  # did not prove itself live — or web-site-current.yml found the site not
  # current (a rollback in effect, the site or its bundle not answering, or a
  # bundle served as HTML) and no tick since has found it current.
  #
  # Only a deploy of main's HEAD counts as recovery. A rollback dispatch
  # (`ref=<older sha>`) succeeds too, but leaves main's head — the commit whose
  # failure raised the alarm — still not live, so it must not silence it.
  # `github.sha` is main's head for a push and for a default-ref dispatch;
  # `needs.build.outputs.sha` is what was actually published.
  #
  # A red `notify-recovery` means the DEPLOY SUCCEEDED and only the issue
  # bookkeeping failed (a `gh` hiccup) — do not re-deploy to fix it; close the
  # issue by hand. `notify-failure` cannot see this job, so no issue is opened
  # for that case.
  notify-recovery:
    needs: [build, deploy]
    if: success() && needs.build.outputs.sha == github.sha
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the deploy-failure issue if one is open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout here either — see the note on notify-failure.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYED_SHA: ${{ needs.build.outputs.sha }}
          TITLE: Web deploy failed
        run: |
          set -euo pipefail
          # Listed, not searched, for the same reason as notify-failure: the
          # search index lags, and a stale index here would leave the alarm on.
          # Same author match as there, and EVERY open match is closed — a
          # duplicate that ever slipped through must not linger as a false alarm.
          OPEN="$(gh issue list --state open --limit 100 \
            --json number,title,author \
            --jq '.[] | select(.title == env.TITLE and .author.login == "app/github-actions") | .number')"
          if [ -z "$OPEN" ]; then
            echo "No open '$TITLE' issue — nothing to close."
            exit 0
          fi
          BODY="Recovered: \`$DEPLOYED_SHA\` is live. Run: $RUN_URL"
          for n in $OPEN; do
            gh issue close "$n" --comment "$BODY"
            echo "Closed #$n."
          done
